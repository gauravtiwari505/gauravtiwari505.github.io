<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaurav Tiwari</title>
<meta name="description" content="Personal site of Gaurav Tiwari. New version coming soon.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.gauravtiwari.co/">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b66; --rule: #e3e3df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #f0f0ee; --muted: #9a9a94; --rule: #2c2c31; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 17px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 2rem;
  }
  main { max-width: 30rem; width: 100%; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
  p { color: var(--muted); margin: 0 0 1.75rem; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 0 0 1.75rem; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
  a:hover { border-bottom-color: currentColor; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: 0.94rem; }
</style>
</head>
<body>
<main>
  <h1>Gaurav Tiwari</h1>
  <p>This site is being rebuilt. Something new here shortly.</p>
  <hr>
  <ul>
    <li><a href="mailto:gaurav@metalytics.uk">Email</a></li>
    <li><a href="https://github.com/gauravtiwari505">GitHub</a></li>
  </ul>
</main>
</body>
</html>
